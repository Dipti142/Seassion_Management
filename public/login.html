<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Login</title>
  <link rel="stylesheet" href="/css/style.css" />
</head>
<body>
  <nav>
    <a href="/">Home</a>
    <a href="/register.html">Register</a>
  </nav>
  <h1>Login</h1>
  <p class="hint">API: POST /api/auth/login &nbsp;|&nbsp; Force: POST /api/auth/force-login</p>

  <form id="loginForm" method="post" action="/api/auth/login">
    <label>Email</label>
    <input name="email" type="email" required />
    <label>Password</label>
    <input name="password" type="password" required />
    <button type="submit">Login</button>
    <button type="button" id="forceLoginBtn">Force login</button>
  </form>

  <pre id="log"></pre>
  <script src="/js/api.js"></script>
  <script>
    function goHomeAfterLogin(token, user, message) {
      setSession(token, user);
      alert(message || "Login successful");
      window.location.href = "/home.html";
    }

    document.getElementById("loginForm").addEventListener("submit", async function (e) {
      e.preventDefault();
      const body = Object.fromEntries(new FormData(e.target));
      const result = await api("/api/auth/login", { method: "POST", body: JSON.stringify(body) });

      if (result.res.status === 409 && result.data.code === "ALREADY_LOGGED_IN") {
        alert(result.data.message + "\nUse Force login if you want this device.");
        return;
      }
      if (!result.res.ok) {
        alert(result.data.message || "Login failed");
        return;
      }
      goHomeAfterLogin(result.data.token, result.data.user, "Login successful");
    });

    document.getElementById("forceLoginBtn").addEventListener("click", async function () {
      const form = document.getElementById("loginForm");
      const body = Object.fromEntries(new FormData(form));
      const result = await api("/api/auth/force-login", { method: "POST", body: JSON.stringify(body) });
      if (!result.res.ok) {
        alert(result.data.message || "Force login failed");
        return;
      }
      goHomeAfterLogin(result.data.token, result.data.user, "Force login successful");
    });
  </script>
</body>
</html>
