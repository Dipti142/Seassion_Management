<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Register</title>
  <link rel="stylesheet" href="/css/style.css" />
</head>
<body>
  <nav>
    <a href="/">Home</a>
    <a href="/login.html">Login</a>
  </nav>
  <h1>Register</h1>
  <p class="hint">API: POST /api/auth/register</p>

  <form id="registerForm" method="post" action="/api/auth/register">
    <label>Name</label>
    <input name="name" required />
    <label>Email</label>
    <input name="email" type="email" required />
    <label>Password</label>
    <input name="password" type="password" required />
    <button type="submit">Register</button>
  </form>

  <pre id="log"></pre>
  <script src="/js/api.js"></script>
  <script>
    document.getElementById("registerForm").addEventListener("submit", async function (e) {
      e.preventDefault();
      const body = Object.fromEntries(new FormData(e.target));
      const result = await api("/api/auth/register", { method: "POST", body: JSON.stringify(body) });
      if (!result.res.ok) {
        alert(result.data.message || "Register failed");
        return;
      }
      alert("Registered successfully");
      window.location.href = "/login.html";
    });
  </script>
</body>
</html>
